# Production Oracle Cloud ARM Ampere Compose Stack:
# 1 Shared PostgreSQL + Reverse Proxy (Nginx + Cloudflare Origin SSL) + Eduportal (+ slots for App2 & App3)
#
# Expected VM folder layout (e.g. /opt/apps):
#   /opt/apps/docker-compose.yml
#   /opt/apps/init-dbs.sh
#   /opt/apps/nginx/conf.d/default.conf
#   /opt/apps/nginx/certs/origin.pem
#   /opt/apps/nginx/certs/origin.key
#   /opt/apps/.env

services:
  # --- Eduportal Backend Application ---
  eduportal:
    image: ${GHCR_IMAGE}
    container_name: eduportal-backend
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-false}
      ATTENDANCE_QR_STEP_SECONDS: ${ATTENDANCE_QR_STEP_SECONDS:-5}
      ATTENDANCE_CHECKIN_WINDOW_SECONDS: ${ATTENDANCE_CHECKIN_WINDOW_SECONDS:-20}
      ATTENDANCE_FACE_THRESHOLD: ${ATTENDANCE_FACE_THRESHOLD:-0.75}
      ATTENDANCE_DEFAULT_RADIUS_METERS: ${ATTENDANCE_DEFAULT_RADIUS_METERS:-100}
      JAVA_OPTS: ${EDUPORTAL_JAVA_OPTS:--Xms128m -Xmx280m -XX:MaxMetaspaceSize=110m -XX:+UseSerialGC}
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  # --- Local Postgres (Keep commented when using Supabase; uncomment later on Ampere VM) ---

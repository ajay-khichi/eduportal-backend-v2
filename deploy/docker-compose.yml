  #     EDUPORTAL_DB_PASSWORD: ${EDUPORTAL_DB_PASSWORD:?EDUPORTAL_DB_PASSWORD is required}
  #   volumes:
  #     - ${POSTGRES_DATA_DIR:-/mnt/pgdata/data}:/var/lib/postgresql/data
  #     - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
  #   networks:
  #     - app-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # --- Uncomment when deploying 2nd & 3rd Spring Boot apps ---
  # app2:
  #   image: ghcr.io/your-github-username/app2:latest
  #   container_name: app2-backend
  #   restart: unless-stopped

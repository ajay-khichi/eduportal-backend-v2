  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     SPRING_PROFILES_ACTIVE: prod
  #     DB_URL: jdbc:postgresql://postgres:5432/${APP3_DB_NAME:-app3_db}
  #     DB_USERNAME: ${APP3_DB_USER:-app3_user}
  #     DB_PASSWORD: ${APP3_DB_PASSWORD}
  #     JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC
  #   networks:
  #     - app-network

  nginx:
    image: nginx:1.27-alpine
    container_name: shared-nginx
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

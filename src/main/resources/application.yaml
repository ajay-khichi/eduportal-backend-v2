spring:
  application:
    name: eduportal-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${JDBC_DATABASE_URL:${DB_URL}}
    username: ${JDBC_DATABASE_USERNAME:${DB_USERNAME}}
    password: ${JDBC_DATABASE_PASSWORD:${DB_PASSWORD}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 20000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null


server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  servlet:
    context-path: /api

app:
  auth:
    public-registration-enabled: ${PUBLIC_REGISTRATION_ENABLED:false}
  attendance:
    qr-step-seconds: ${ATTENDANCE_QR_STEP_SECONDS:5}
    checkin-window-seconds: ${ATTENDANCE_CHECKIN_WINDOW_SECONDS:20}
    face-similarity-threshold: ${ATTENDANCE_FACE_THRESHOLD:0.75}
    default-geofence-radius-meters: ${ATTENDANCE_DEFAULT_RADIUS_METERS:100}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://10.14.217.39:5173}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - Accept
    allow-credentials: true
  security:
    public-urls:
    - /auth/login
    - /auth/register
    - /auth/refresh
    - /public/**
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /actuator/health
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 2592000000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  datadog:
    metrics:
      export:
        enabled: ${MANAGEMENT_DATADOG_METRICS_EXPORT_ENABLED:false}
        api-key: ${DATADOG_API_KEY:}
        application-key: ${DATADOG_APP_KEY:}
        uri: ${DATADOG_URI:https://api.datadoghq.com}
        descriptions: ${DATADOG_DESCRIPTIONS:false}
        step: 1m

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
# ==========================================
# DEVELOPMENT ENVIRONMENT
# ==========================================
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

logging:
  level:
    root: INFO
    in.ignishers: DEBUG
    org.hibernate.sql: DEBUG
    org.springframework.security: INFO

---
# ==========================================
# PRODUCTION ENVIRONMENT
# ==========================================
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}


logging:
  level:
    root: WARN
    in.ignishers: INFO
    org.springframework.security: WARN


spring:
  application:
    name: eduportal-backend
  profiles:
    active:
      - dev

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null


server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
# ==========================================
# DEVELOPMENT ENVIRONMENT
# ==========================================
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

logging:
  level:
    root: INFO
    com.ignishers: DEBUG
    org.hibernate.sql: DEBUG
    org.springframework.security: INFO

---
# ==========================================
# PRODUCTION ENVIRONMENT
# ==========================================
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate


logging:
  level:
    root: WARN
    com.ignishers: INFO
    org.springframework.security: WARN

